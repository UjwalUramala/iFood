<!DOCTYPE html>
<html>

<head>
    <title>iFood - Donor Registration</title>
</head>

<body background="ifood bg.png">

    <table width="100%"
           border="1"
           cellpadding="12"
           bgcolor="white">

        <tr bgcolor="#0D7A41">

            <th colspan="2">

                <font color="white" size="5">
                    Donor Registration
                </font>

            </th>

        </tr>


        <tr>

            <td width="30%">
                <b>Full Name</b>
            </td>

            <td>
                <input type="text"
                       placeholder="Enter your name">
            </td>

        </tr>


        <tr>

            <td>
                <b>Donor Type</b>
            </td>

            <td>

                <select>

                    <option>Restaurant</option>
                    <option>Hotel</option>
                    <option>Household</option>
                    <option>Institution</option>

                </select>

            </td>

        </tr>


        <tr>

            <td>
                <b>Phone Number</b>
            </td>

            <td>
                <input type="tel"
                       placeholder="8639207260">
            </td>

        </tr>


        <tr>

            <td>
                <b>Email</b>
            </td>

            <td>
                <input type="email"
                       placeholder="ifood@gmail.com">
            </td>

        </tr>


        <tr>

            <td>
                <b>Location</b>
            </td>

            <td>
                <input type="text"
                       placeholder="Vijayawada">
            </td>

        </tr>


        <tr>

            <td>
                <b>Address</b>
            </td>

            <td>

                <textarea rows="4"
                          cols="40"
                          placeholder="Enter address"></textarea>

            </td>

        </tr>


        <tr>

            <td colspan="2"
                align="center">

                <input type="checkbox">

                I agree to share accurate information.

                <br><br>

                <input type="submit"
                       value="Register">

            </td>

        </tr>

    </table>

</body>

</html>
