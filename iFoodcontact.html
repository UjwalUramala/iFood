<!DOCTYPE html>
<html>

<head>
    <title>iFood - Contact</title>
</head>

<body background="ifood bg.png">

    <table width="100%"
           border="1"
           cellpadding="15"
           bgcolor="white">

        <tr bgcolor="#0D7A41">

            <th colspan="2">

                <font color="white" size="5">
                    Contact / Feedback
                </font>

            </th>

        </tr>


        <tr>

            <td width="30%">
                <b>Name</b>
            </td>

            <td>

                <input type="text"
                       placeholder="Enter your name">

            </td>

        </tr>


        <tr>

            <td>
                <b>Email</b>
            </td>

            <td>

                <input type="email"
                       placeholder="ifood@gmail.com">

            </td>

        </tr>


        <tr>

            <td>
                <b>Message</b>
            </td>

            <td>

                <textarea rows="5"
                          cols="40"
                          placeholder="Enter your feedback"></textarea>

            </td>

        </tr>


        <tr>

            <td colspan="2"
                align="center">

                <input type="submit"
                       value="Send Message">

            </td>

        </tr>

    </table>


    <br>


    <!-- CONTACT DETAILS -->

    <table width="100%"
           bgcolor="#F1F8E9"
           cellpadding="12">

        <tr>

            <td align="center">

                <font color="#0D7A41">

                    <b>Contact iFood</b>

                </font>

                &nbsp; | &nbsp;

                📧 ifood@example.com

                &nbsp; | &nbsp;

                📞 +91 86392 07260

                &nbsp; | &nbsp;

                📍 Vijayawada, Andhra Pradesh

            </td>

        </tr>

    </table>


    <br>


    <!-- FOOTER -->

    <table width="100%"
           bgcolor="#0D7A41"
           cellpadding="15">

        <tr>

            <td align="center">

                <font color="white">

                    <marquee behavior="alternate"
                             scrollamount="2"
                             width="70%">

                        <b>
                            🍱 Share A Plate

                        </b>

                    </marquee>


                    <br><br>


                    <b>iFood</b>

                    &nbsp; | &nbsp;

                    "Share A Plate. Share Hope."

                    &nbsp; | &nbsp;

                    © 2026 iFood

                </font>

            </td>

        </tr>

    </table>

</html>
