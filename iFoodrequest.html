<!DOCTYPE html>
<html>

<head>
    <title>iFood - Request Food</title>
</head>

<body background="ifood bg.png">

    <table width="100%"
           border="1"
           cellpadding="12"
           bgcolor="white">

        <tr bgcolor="#0D7A41">

            <th colspan="2">

                <font color="white" size="5">
                    Request Food
                </font>

            </th>

        </tr>


        <tr>

            <td width="30%">
                <b>Your Name</b>
            </td>

            <td>
                <input type="text"
                       placeholder="Enter your name">
            </td>

        </tr>


        <tr>

            <td>
                <b>Organization</b>
            </td>

            <td>
                <input type="text"
                       placeholder="Helping Hands NGO">
            </td>

        </tr>


        <tr>

            <td>
                <b>Phone Number</b>
            </td>

            <td>
                <input type="tel"
                       placeholder="8639207260">
            </td>

        </tr>


        <tr>

            <td>
                <b>Food Required</b>
            </td>

            <td>

                <select>

                    <option>Vegetable Rice</option>
                    <option>Idly & Sambar</option>
                    <option>Chapati & Curry</option>
                    <option>Bread & Fruits</option>

                </select>

            </td>

        </tr>


        <tr>

            <td>
                <b>Required Quantity</b>
            </td>

            <td>
                <input type="number"
                       placeholder="30">
            </td>

        </tr>


        <tr>

            <td>
                <b>Pickup Date & Time</b>
            </td>

            <td>
                <input type="datetime-local">
            </td>

        </tr>


        <tr>

            <td>
                <b>Purpose</b>
            </td>

            <td>

                <textarea rows="4"
                          cols="40"
                          placeholder="Food distribution to people in need"></textarea>

            </td>

        </tr>


        <tr>

            <td colspan="2"
                align="center">

                <input type="submit"
                       value="Submit Request">

            </td>

        </tr>

    </table>

</body>

</html>
