<!DOCTYPE html>
<html>

<head>
    <title>iFood - Donate Food</title>
</head>

<body background="ifood bg.png">

    <table width="100%"
           border="1"
           cellpadding="12"
           bgcolor="white">

        <tr bgcolor="#0D7A41">

            <th colspan="2">

                <font color="white" size="5">
                    Donate Surplus Food
                </font>

            </th>

        </tr>


        <tr>

            <td width="30%">
                <b>Food Name</b>
            </td>

            <td>
                <input type="text"
                       placeholder="Vegetable Rice">
            </td>

        </tr>


        <tr>

            <td>
                <b>Food Category</b>
            </td>

            <td>

                <select>

                    <option>Vegetarian</option>
                    <option>Non-Vegetarian</option>
                    <option>Bakery</option>
                    <option>Fruits</option>

                </select>

            </td>

        </tr>


        <tr>

            <td>
                <b>Quantity (Meals)</b>
            </td>

            <td>
                <input type="number"
                       placeholder="30">
            </td>

        </tr>


        <tr>

            <td>
                <b>Prepared Date & Time</b>
            </td>

            <td>
                <input type="datetime-local">
            </td>

        </tr>


        <tr>

            <td>
                <b>Consume Before</b>
            </td>

            <td>
                <input type="datetime-local">
            </td>

        </tr>


        <tr>

            <td>
                <b>Pickup Location</b>
            </td>

            <td>
                <input type="text"
                       placeholder="Vijayawada">
            </td>

        </tr>


        <tr>

            <td>
                <b>Contact Number</b>
            </td>

            <td>
                <input type="tel"
                       placeholder="8639207260">
            </td>

        </tr>


        <tr>

            <td>
                <b>Additional Information</b>
            </td>

            <td>

                <textarea rows="4"
                          cols="40"
                          placeholder="Enter details about the food"></textarea>

            </td>

        </tr>


        <tr>

            <td colspan="2"
                align="center">

                <input type="submit"
                       value="Donate Food">

            </td>

        </tr>

    </table>

</body>

</html>
